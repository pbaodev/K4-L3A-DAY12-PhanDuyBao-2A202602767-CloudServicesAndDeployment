name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkpoint tests
        # Bỏ test_cp5 (cần bản deploy đang sống), test_bonus_cicd (tự kiểm tra
        # badge của chính workflow này) và test build Docker (job `build` lo).
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice (chưa cấu hình secret)
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::RAILWAY_TOKEN chưa được set trong GitHub Secrets — bỏ qua bước deploy."

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli@4

      - name: Deploy
        if: env.RAILWAY_TOKEN != ''
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"

      - name: Smoke test
        if: env.RAILWAY_TOKEN != '' && vars.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 12); do
            curl -fsS "${{ vars.PUBLIC_URL }}/health" && exit 0
            sleep 10
          done
          exit 1
