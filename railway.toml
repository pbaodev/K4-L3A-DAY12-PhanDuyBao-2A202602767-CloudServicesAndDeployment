# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: CMD trong Dockerfile đã chạy qua `sh -c` nên $PORT
# được thay giá trị. startCommand của Railway không qua shell → "$PORT" sẽ bị
# truyền nguyên văn cho uvicorn và app không khởi động được.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
